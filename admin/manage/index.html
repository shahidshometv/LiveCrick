<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>LiveCrick Admin: Channels</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo">LiveCrick Admin</span>
      <span class="tagline">Channel stream links</span>
    </header>

    <main class="wrap">
      <div class="notice">
        This page edits the list in your browser only. Click <strong>Export JSON</strong>
        and commit the file to <code>admin/data/channels.json</code> to publish.
        Anyone who can open this page can edit it, so protect it (see README) before deploying publicly.
      </div>

      <section class="panel">
        <h2 id="form-title">Add channel</h2>
        <form id="channel-form" novalidate>
          <input type="hidden" id="f-id" />
          <div class="fields">
            <label>Name *
              <input id="f-name" required maxlength="80" />
            </label>
            <label>Language *
              <select id="f-language">
                <option value="en">English (en)</option>
                <option value="hi">Hindi (hi)</option>
                <option value="ta">Tamil (ta)</option>
                <option value="te">Telugu (te)</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>Category *
              <select id="f-category">
                <option value="sports">Sports</option>
                <option value="news">News</option>
                <option value="movies">Movies</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>Logo URL (optional)
              <input id="f-logo" type="url" placeholder="https://..." />
            </label>
          </div>

          <label>Stream URL (HLS .m3u8) *
            <input id="f-stream" type="url" placeholder="https://.../playlist.m3u8" />
          </label>

          <label>Distribution rights: licensor or source and agreement reference *
            <input id="f-rights" maxlength="200" placeholder="e.g. Broadcaster X, licence ref 2026-114, expires 2027-03-31" />
          </label>

          <label class="check">
            <input id="f-attest" type="checkbox" />
            I confirm this stream is licensed for distribution in the territories where it is offered.
          </label>

          <div id="form-error" class="error" role="alert"></div>

          <div class="actions">
            <button type="submit" class="btn primary" id="btn-save">Add channel</button>
            <button type="button" class="btn" id="btn-reset">Clear form</button>
            <button type="button" class="btn" id="btn-test">Test stream</button>
          </div>
          <video id="test-video" controls playsinline class="hidden"></video>
          <p id="test-msg" class="meta"></p>
        </form>
      </section>

      <section class="panel">
        <div class="row">
          <h2>Channels <span id="count" class="meta"></span></h2>
          <div class="actions">
            <button type="button" class="btn" id="btn-import-open">Import JSON</button>
            <button type="button" class="btn primary" id="btn-export">Export JSON</button>
          </div>
        </div>
        <div id="list" class="list"></div>
        <textarea id="import-box" class="hidden" placeholder="Paste channels.json here, then click Load"></textarea>
        <div id="import-actions" class="actions hidden">
          <button type="button" class="btn primary" id="btn-import">Load</button>
          <button type="button" class="btn" id="btn-import-cancel">Cancel</button>
        </div>
        <div id="status" class="meta"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
