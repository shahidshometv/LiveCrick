<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boundary – Cricket video player</title>
<meta name="theme-color" content="#0f1419">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1419; --stand:#182029; --line:#2a3541;
  --light:#eef2f4; --mute:#93a1ad;
  --pitch:#4c9f6a; --ball:#d02c3e;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Source Sans 3",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--night);color:var(--light);font-family:var(--body);font-size:16px;line-height:1.5}
body{min-height:100vh}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}

header{display:flex;align-items:center;gap:16px;padding:12px clamp(16px,3vw,32px);border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:baseline;gap:14px;flex:0 0 auto}
header h1{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.01em}
header p{color:var(--mute)}
.channel-nav{display:flex;gap:6px;min-width:0;margin-left:auto;overflow-x:auto;scrollbar-width:thin}
.channel-nav[hidden]{display:none}
.channel-tab{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--mute);white-space:nowrap}
.channel-tab[aria-pressed="true"]{border-color:var(--pitch);color:var(--light);background:var(--stand)}
@media(max-width:740px){header{flex-wrap:wrap}.channel-nav{width:100%;margin-left:0}.brand{width:100%}}

main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding:24px clamp(16px,3vw,32px);max-width:1500px;margin:0 auto}
@media(max-width:960px){main{grid-template-columns:1fr}}

.stage{background:#000;border-radius:6px;overflow:hidden;position:relative;aspect-ratio:16/9}
video{width:100%;height:100%;display:block;background:#000}
video.hide{display:none}
iframe{width:100%;height:100%;border:0;display:none;background:#000}
iframe.show{display:block}
.overlay{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:rgba(15,20,25,.92)}
.overlay.show{display:grid}
.overlay p{max-width:36ch;color:var(--mute)}
.overlay strong{display:block;font-family:var(--display);font-size:1.6rem;color:var(--light);margin-bottom:6px}

.now{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.now h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.1}
.now .sub{color:var(--mute);white-space:pre-line}
.controls{display:flex;gap:8px;align-items:center}
.controls label{color:var(--mute);font-size:.9rem}
select{background:var(--stand);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.btn{background:var(--stand);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--pitch)}
.btn.pri{display:inline-block;margin-top:14px;background:var(--pitch);border-color:var(--pitch);color:#07120b;font-weight:600;text-decoration:none}
.btn.pri[hidden]{display:none}

aside h3{font-family:var(--display);font-weight:500;font-size:1.25rem;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--mute)}
.tab[aria-pressed="true"]{border-color:var(--pitch);color:var(--light);background:var(--stand)}

ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.item{width:100%;text-align:left;background:var(--stand);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--mute)}
.item[aria-current="true"]{border-color:var(--pitch);border-left-color:var(--pitch)}
.item[data-status="live"]{border-left-color:var(--ball)}
.item .t{font-weight:600}
.item .m{color:var(--mute);font-size:.9rem;display:flex;gap:10px;margin-top:2px}
.badge{font-weight:600;color:var(--light)}
.badge.live{color:var(--ball)}
.empty{color:var(--mute);padding:16px 0}
.channels{margin:0 0 24px;padding:0 0 16px;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.badge.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ball);margin-right:6px;animation:p 1.6s ease-in-out infinite}}
@media(prefers-reduced-motion:reduce){.badge.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ball);margin-right:6px}}
@keyframes p{50%{opacity:.35}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="site">Boundary</h1>
    <p>Cricket video player</p>
  </div>
  <nav id="channelCategories" class="channel-nav" aria-label="Channel categories" hidden></nav>
</header>

<main>
  <section aria-label="Player">
    <div class="stage">
      <video id="video" controls playsinline preload="metadata"></video>
      <iframe id="frame" title="Match stream" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups allow-popups-to-escape-sandbox"></iframe>
      <div class="overlay show" id="overlay"><div><strong id="ovT">Pick a match</strong><p id="ovP">Choose a match from the list to start watching.</p><a class="btn pri" id="ovA" target="_blank" rel="noopener noreferrer" hidden></a></div></div>
    </div>
    <div class="now">
      <div>
        <h2 id="nowT">No match selected</h2>
        <div class="sub" id="nowS"></div>
      </div>
      <div class="controls">
        <label for="quality">Quality</label>
        <select id="quality" disabled><option value="-1">Auto</option></select>
        <button class="btn" id="fs" type="button">Fullscreen</button>
      </div>
    </div>
  </section>

  <aside aria-label="Matches">
    <section class="channels" aria-label="Custom channels">
      <h3>Channels</h3>
      <ul id="channelList"></ul>
    </section>
    <h3>Matches</h3>
    <div class="tabs" role="group" aria-label="Filter matches">
      <button class="tab" type="button" data-f="all" aria-pressed="true">All</button>
      <button class="tab" type="button" data-f="live" aria-pressed="false">Live</button>
      <button class="tab" type="button" data-f="upcoming" aria-pressed="false">Upcoming</button>
      <button class="tab" type="button" data-f="finished" aria-pressed="false">Finished</button>
    </div>
    <ul id="list"></ul>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  var B=window.Boundary;
  var video=document.getElementById('video'), frame=document.getElementById('frame'), list=document.getElementById('list');
  var channelList=document.getElementById('channelList'), categoryNav=document.getElementById('channelCategories');
  var overlay=document.getElementById('overlay'), ovT=document.getElementById('ovT'), ovP=document.getElementById('ovP'), ovA=document.getElementById('ovA');
  var nowT=document.getElementById('nowT'), nowS=document.getElementById('nowS');
  var quality=document.getElementById('quality');
  var state={items:[],channels:[],filter:'all',channelFilter:'all',current:null,currentChannel:null,hls:null};
  var LABEL={live:'Live',upcoming:'Upcoming',finished:'Finished'};
  var statusOf=B.statusOf, when=B.when;

  function scoreText(it){
    if(!it.api||!it.api.score||!it.api.score.length)return '';
    return it.api.score.map(function(x){
      var name=(x.inning||'').replace(/\s*Inning\s*\d+/i,'');
      return name+' '+x.r+'/'+x.w+(x.o!=null?' ('+x.o+' ov)':'');
    }).join(' · ');
  }
  function infoLine(it){return (statusOf(it)!=='upcoming'&&it.api&&it.api.status)?it.api.status:'';}
  function nowLine(it){return [it.series,it.venue,when(it)].filter(Boolean).join(' · ')+(infoLine(it)?'\n'+infoLine(it):'');}
  function activeWatch(){
    if(state.current&&state.current.watch)return state.current.watch;
    return state.currentChannel?{name:state.currentChannel.name,url:state.currentChannel.url}:null;
  }

  function message(title,text,watch,linkText){
    ovT.textContent=title;ovP.textContent=text;
    if(watch&&watch.url){ovA.href=watch.url;ovA.textContent=linkText||'Watch on '+watch.name;ovA.hidden=false;}else{ovA.hidden=true;}
    overlay.classList.add('show');
  }
  function hideMessage(){overlay.classList.remove('show');}

  function render(){
    list.textContent='';
    var shown=B.sorted(state.items).filter(function(i){return state.filter==='all'||i._s===state.filter;});
    if(!shown.length){
      var li=document.createElement('li');li.className='empty';
      li.textContent='No '+(state.filter==='all'?'':LABEL[state.filter].toLowerCase()+' ')+'matches right now.';
      list.appendChild(li);return;
    }
    shown.forEach(function(it){
      var li=document.createElement('li');
      var b=document.createElement('button');
      b.type='button';b.className='item';b.dataset.status=it._s;
      if(state.current&&state.current.id===it.id)b.setAttribute('aria-current','true');
      var t=document.createElement('div');t.className='t';t.textContent=it.title;
      var m=document.createElement('div');m.className='m';
      var s=document.createElement('span');s.className='badge '+it._s;s.textContent=LABEL[it._s];
      var w=document.createElement('span');w.textContent=when(it);
      m.appendChild(s);m.appendChild(w);
      if(it.embed||it.url){var p=document.createElement('span');p.textContent='▶ Play here';m.appendChild(p);}
      var v=document.createElement('div');v.className='m';v.textContent=[it.series,it.venue].filter(Boolean).join(' · ');
      b.appendChild(t);b.appendChild(m);b.appendChild(v);
      var sc=scoreText(it);
      if(sc&&it._s!=='upcoming'){var x=document.createElement('div');x.className='m';x.textContent=sc;b.appendChild(x);}
      b.addEventListener('click',function(){select(it);});
      li.appendChild(b);list.appendChild(li);
    });
  }

  function renderChannels(){
    var categories=Array.from(new Set(state.channels.map(function(channel){return channel.category;}))).sort();
    if(state.channelFilter!=='all'&&categories.indexOf(state.channelFilter)===-1)state.channelFilter='all';
    categoryNav.textContent='';
    categoryNav.hidden=!categories.length;
    var allButton=document.createElement('button');
    allButton.type='button';allButton.className='channel-tab';allButton.textContent='All';
    allButton.setAttribute('aria-pressed',state.channelFilter==='all'?'true':'false');
    allButton.addEventListener('click',function(){state.channelFilter='all';renderChannels();});
    categoryNav.appendChild(allButton);
    categories.forEach(function(category){
      var button=document.createElement('button');
      button.type='button';button.className='channel-tab';button.textContent=category;
      button.setAttribute('aria-pressed',state.channelFilter===category?'true':'false');
      button.addEventListener('click',function(){state.channelFilter=category;renderChannels();});
      categoryNav.appendChild(button);
    });
    channelList.textContent='';
    var channels=state.channels.filter(function(channel){return state.channelFilter==='all'||channel.category===state.channelFilter;})
      .sort(function(a,b){return a.name.localeCompare(b.name);});
    if(!channels.length){
      var empty=document.createElement('li');empty.className='empty';
      empty.textContent=state.channels.length?'No channels in this category.':'No custom channels available.';
      channelList.appendChild(empty);return;
    }
    channels.forEach(function(channel){
      var li=document.createElement('li'),button=document.createElement('button');
      button.type='button';button.className='item';
      if(state.currentChannel&&state.currentChannel.id===channel.id)button.setAttribute('aria-current','true');
      var title=document.createElement('div');title.className='t';title.textContent=channel.name;
      var meta=document.createElement('div');meta.className='m';
      var category=document.createElement('span');category.className='badge';category.textContent=channel.category;
      var playLabel=document.createElement('span');playLabel.textContent='▶ Play channel';
      meta.appendChild(category);meta.appendChild(playLabel);button.appendChild(title);button.appendChild(meta);
      button.addEventListener('click',function(){playChannel(channel);});
      li.appendChild(button);channelList.appendChild(li);
    });
  }

  function resetPlayers(){
    if(state.hls){state.hls.destroy();state.hls=null;}
    video.removeAttribute('src');video.load();video.classList.remove('hide');
    frame.classList.remove('show');frame.removeAttribute('src');
    quality.innerHTML='<option value="-1">Auto</option>';quality.disabled=true;
  }

  function select(it){
    state.current=it;
    state.currentChannel=null;
    try{localStorage.setItem('boundary:last',it.id);}catch(e){}
    var st=statusOf(it);
    nowT.textContent=it.title;
    nowS.textContent=nowLine(it);
    render();renderChannels();resetPlayers();
    var em=B.embedOf(it.embed||it.url);
    if(em){
      hideMessage();
      if(em.kind==='iframe'){video.classList.add('hide');frame.src=em.src;frame.classList.add('show');}
      else play(em.src);
      return;
    }
    var sc=scoreText(it);
    if(st==='upcoming')message('Starts '+when(it),'Streams open at the start time. Your local time is shown.',it.watch);
    else if(st==='finished')message('Match finished',infoLine(it)||'There is no replay in this app.',it.watch);
    else message('Live now',sc||'This match streams on the official broadcaster.',it.watch);
  }

  function playChannel(channel){
    state.current=null;state.currentChannel=channel;
    nowT.textContent=channel.name;
    nowS.textContent=channel.category;
    render();renderChannels();resetPlayers();
    var protocol;
    try{protocol=new URL(channel.url).protocol;}catch(e){protocol='';}
    if(protocol==='rtsp:'){
      message('RTSP source','Browsers cannot play RTSP directly. Add an HLS or WebRTC relay URL to preview this channel here.',activeWatch(),'Open RTSP source');
      return;
    }
    if(protocol==='http:'){
      message('HTTP source','This site uses HTTPS, so browsers may block insecure HTTP playback. Open the source in a new tab or use an HTTPS stream URL.',activeWatch(),'Open HTTP source');
      return;
    }
    var em=B.embedOf(channel.url);
    if(!em){message('Channel unavailable','This channel link could not be played.',{name:channel.name,url:channel.url});return;}
    hideMessage();
    if(em.kind==='iframe'){video.classList.add('hide');frame.src=em.src;frame.classList.add('show');}
    else play(em.src);
  }

  function play(url){
    var isHls=/\.m3u8(\?|$)/i.test(url);
    if(isHls&&window.Hls&&Hls.isSupported()){
      var hls=new Hls({lowLatencyMode:true});
      state.hls=hls;hls.loadSource(url);hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,function(){
        var seen={};
        hls.levels.forEach(function(l,i){
          if(!l.height||seen[l.height])return;seen[l.height]=1;
          var o=document.createElement('option');o.value=i;o.textContent=l.height+'p';quality.appendChild(o);
        });
        quality.disabled=quality.options.length<2;
        video.play().catch(function(){});
      });
      hls.on(Hls.Events.ERROR,function(_,d){
        if(!d.fatal)return;
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR){message('Stream unavailable','The stream could not be loaded. It may be offline or blocked.',activeWatch());hls.destroy();state.hls=null;}
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}
        else{message('Playback failed','Something went wrong while playing this stream.');hls.destroy();state.hls=null;}
      });
    }else{
      video.src=url;
      video.addEventListener('error',function onE(){video.removeEventListener('error',onE);message('Stream unavailable','This stream could not be played in your browser.',activeWatch());});
      video.play().catch(function(){});
    }
  }

  quality.addEventListener('change',function(){if(state.hls)state.hls.currentLevel=parseInt(quality.value,10);});
  document.getElementById('fs').addEventListener('click',function(){
    var el=video.parentElement;
    if(document.fullscreenElement)document.exitFullscreen();
    else if(el.requestFullscreen)el.requestFullscreen();
    else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
  });
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      state.filter=t.dataset.f;
      document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-pressed',x===t?'true':'false');});
      render();
    });
  });

  function refresh(){
    B.loadData().then(function(d){
      state.items=d.items;state.channels=d.channels;render();renderChannels();
      if(state.current){
        var cur=d.items.filter(function(i){return i.id===state.current.id;})[0];
        if(cur){
          var changed=(cur.embed||cur.url)!==(state.current.embed||state.current.url);
          state.current=cur;nowS.textContent=nowLine(cur);
          if(changed)select(cur);
        }
      }
      if(state.currentChannel){
        var channel=d.channels.filter(function(item){return item.id===state.currentChannel.id;})[0];
        if(channel){
          var channelChanged=channel.url!==state.currentChannel.url;
          state.currentChannel=channel;
          nowS.textContent=channel.category;
          if(channelChanged)playChannel(channel);
        }else{
          state.currentChannel=null;resetPlayers();message('Channel removed','This custom channel is no longer available.');
        }
      }
    }).catch(function(){});
  }

  B.loadData().then(function(d){
    if(d.siteName){document.getElementById('site').textContent=d.siteName;document.title=d.siteName+' – Cricket video player';}
    state.items=d.items;state.channels=d.channels;renderChannels();
    var all=B.sorted(state.items);
    var pick=all.filter(function(i){return i._s==='live';})[0]||all.filter(function(i){return i._s==='upcoming';})[0]||all[0];
    if(pick)select(pick);else if(state.channels.length)playChannel(state.channels[0]);else render();
    setInterval(refresh,120000);
  }).catch(function(){message('Could not load matches','streams.json is missing or invalid.');});
})();
</script>
</body>
</html>
