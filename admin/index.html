<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="LiveCrick - free cricket scores and live TV." />
    <title>LiveCrick</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo">LiveCrick</span>
      <span class="tagline">Watch More. Pay Nothing.</span>
    </header>

    <nav class="tabs" aria-label="Main">
      <a href="#home" data-tab="home">Home</a>
      <a href="#cricket" data-tab="cricket">Cricket</a>
      <a href="#livetv" data-tab="livetv">Live TV</a>
      <a href="#profile" data-tab="profile">Profile</a>
    </nav>

    <main id="view" class="view"></main>

    <div id="player" class="player hidden" role="dialog" aria-modal="true">
      <div class="player-bar">
        <strong id="player-title"></strong>
        <button id="player-close" type="button">Close</button>
      </div>
      <video id="video" controls playsinline></video>
      <p id="player-msg" class="msg"></p>
    </div>

    <!-- Pinned HLS player for browsers without native HLS (Chrome, Edge, Android). -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
